name: poll
# GitHub's own cron is unreliable, so each run loops every 5 min for ~5.5h, then starts the next run.
# The hourly cron only restarts the chain if it ever breaks; concurrency keeps runs sequential.
on:
  workflow_dispatch:
    inputs:
      loop_seconds:
        description: "How long this run loops (test with a small value)"
        default: "19800"
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: ${{ inputs.loop_seconds == '19800' && 'poll' || github.event_name == 'schedule' && 'poll' || 'poll-test' }}
permissions:
  actions: write
  contents: read
env:
  LAST_DATE: "2026-10-21"
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Check every 5 min
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: "1"
        run: |
          end=$((SECONDS + ${{ inputs.loop_seconds || 19800 }}))
          while [ $SECONDS -lt $end ] && [[ "$(TZ=Europe/London date +%F)" < "$LAST_DATE" || "$(TZ=Europe/London date +%F)" == "$LAST_DATE" ]]; do
            echo "$(TZ=Europe/London date +%H:%M:%S) checking"
            timeout 120 uv run --no-dev python -m snap_watch --config config.cloud.json --state state.json || echo "check failed or timed out ($?)"
            sleep 300
          done
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$(TZ=Europe/London date +%F)" > "$LAST_DATE" ]]; then gh workflow run poll -R ${{ github.repository }}; fi
